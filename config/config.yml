

data_source:
  spot: csv        # csv | fred
  rates_us: csv    # csv | fred | ecos
  rates_kr: csv    # csv | ecos

fred:
  api_key_env: FRED_API_KEY
  series:
    spot_usdkrw: DEXKOUS
    us_yield_1y: DGS1
    sofr_overnight: SOFR
  date_range:
    start: 2022-01-01
    end: 2024-12-31

ecos:
  api_key_env: ECOS_API_KEY
  items:
    kr_policy_rate: { stat_code: "722Y001", cycle: "M", item_code: "" }
  date_range:
    start: 2022-01
    end: 2024-12

holidays:
  countries: [KR, US]
  cache_dir: data/reference/holidays_cache


# Policy Configuration - supports both rule-based (v0) and ML-enhanced (v1) modes
policy:
  version: v1              # v0 (rule-based) | v1 (ML-enhanced with fallback)
  
  # v0 Configuration (Rule-based)
  v0:
    size_thresholds: [100000, 1000000]
    ratios: [0.3, 0.5, 0.8]
    bump_to: 0.8
    reduce_to: 0.5
    features:
      rv_windows: [20, 60]
      ma_windows: [20, 60]
      rv20_thresh: 0.015
      carry_thresh: 0.0
  
  # v1 Configuration (ML-enhanced)
  v1:
    weights:
      credit: 0.0         # +면 등급↑일수록 헤지↑
      size: 0.0           # +면 노출↑일수록 헤지↑
      relationship: 0.0   # +면 관계↑일수록 헤지↑
    bounds:
      min_ratio: 0.0
      max_ratio: 0.9
    # Fallback to v0 when ML prediction fails
    fallback_to_v0: true

tuning:
  objective_weights: { sigma: 1.0, es: 1.0, mean: 0.5 }
  grid:
    rv20_thresh: [0.01, 0.015, 0.02]
    carry_thresh: [-0.002, 0.0, 0.002]
  min_mean_ratio: 0.9

risk:
  alpha: 0.99
  window_days: 252
  jurisdictions:
    KR: { alpha: 0.99,  window_days: 252 }
    US: { alpha: 0.975, window_days: 500 }

governance:
  enabled: true
  snapshot_dir: reports/_artifacts/policy_snapshots
  changelog_csv: reports/policy_changelog.csv
  default_actor: "system"

# Data Quality and Validation Settings
data_quality:
  auto_fill_gaps: true              # 자동으로 월별 데이터 공백 채우기
  gap_fill_method: "zero"           # zero | forward_fill | interpolate
  maturity_tolerance_days: 10       # 선도 만기 허용 오차 (일)
  min_companies_threshold: 5        # 최소 회사 수 임계값
  validation:
    check_monthly_continuity: true  # 월별 연속성 검사
    check_maturity_consistency: true # 선도 만기 일관성 검사
    generate_quality_report: true   # 품질 보고서 생성
    warn_on_gaps: true             # 데이터 공백 시 경고
    fail_on_critical_gaps: false   # 심각한 공백 시 실행 중단

ifrs9:
  dollar_offset_bounds: [0.85, 1.15]
  regression_r2_threshold: 0.90
  sampling: { period: "Q", rule: "prev_business_day" }  # Q|M, rule: prev_business_day|month_end|avg
  governance:
    enabled: true
    snapshot_dir: reports/_artifacts/ifrs9_snapshots
    changelog_csv: reports/ifrs9_changelog.csv

# Machine Learning Models for Advanced Hedging
ml_models:
  enabled: true
  
  # Minimum data requirements for ML training
  data_requirements:
    min_samples_total: 50         # Minimum total samples for any ML training
    min_samples_per_company: 3    # Minimum samples per company
    min_companies: 5              # Minimum number of companies
    min_time_periods: 6           # Minimum time periods in dataset
  
  hedge_ratio_prediction:
    enabled: true
    model_type: random_forest  # random_forest | xgboost | lightgbm
    retrain_frequency: quarterly
    
    # Training parameters with safeguards
    training:
      test_size: 0.2              # Test split ratio (adjusted if data is small)
      cv_folds: 5                 # Cross-validation folds (adjusted dynamically)
      min_samples_for_cv: 25      # Minimum samples required for cross-validation
      time_series_split: true     # Use time-based splitting when possible
      
    model_params:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      
    features:
      - net_exposure_size
      - volatility_signals
      - carry_trade_momentum
      - seasonal_patterns
      - company_clustering
    
  exposure_forecasting:
    enabled: true
    model_type: random_forest  # random_forest | xgboost | lightgbm
    horizon_months: 3
    min_history_months: 12
    
    model_params:
      n_estimators: 100
      max_depth: 12
    
  model_storage:
    save_models: true
    model_dir: models/
    
  performance_monitoring:
    track_predictions: true
    retraining_threshold_r2: 0.6
    prediction_log: reports/ml_predictions.csv
    
    # Performance thresholds
    alert_thresholds:
      r2_degradation: 0.1       # Alert if R² drops by this much
      prediction_drift: 0.2     # Alert if prediction distribution changes
      error_rate_increase: 0.15 # Alert if error rate increases
